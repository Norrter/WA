<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1c1e" />
    <title>Greek's Gym</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Forum&family=Manrope:wght@400;500;600;700&display=swap"
    />

    <!-- Тема ставится до загрузки приложения, чтобы страница не мигала.
         Ключ и логика те же, что в src/lib/theme.ts -->
    <script>
      (function () {
        var choice = "system";
        try {
          var saved = localStorage.getItem("gg-theme");
          if (saved === "dark" || saved === "light" || saved === "system") choice = saved;
        } catch (e) {}
        var theme =
          choice === "system"
            ? window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"
            : choice;
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "light" ? "#f3efea" : "#1b1c1e");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
